# Central stack plus a demo estate to monitor.
#
# The central services (prometheus, alertmanager, loki, grafana) only receive,
# store, query and alert. Nothing in this file gives them a way to reach back
# into a monitored system.

name: opstack-demo

services:
  # --- central -------------------------------------------------------------

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      # Lets collectors push metrics instead of being scraped.
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.0
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki:/etc/loki:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Read-only anonymous access so the demo opens straight onto a dashboard.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/overview.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  # --- demo estate -----------------------------------------------------------
  # In a real deployment these run on, or next to, the systems they watch and
  # are installed by the team that owns those systems.

  linux-collector:
    image: grafana/alloy:v1.10.0
    hostname: demo-linux-01
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./collectors/linux/config.alloy:/etc/alloy/config.alloy:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      - /var/log:/host/var/log:ro
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  database-sim:
    build: ./collectors/simulated
    command: ["--profile", "database"]
    restart: unless-stopped

  switch-sim:
    build: ./collectors/simulated
    command: ["--profile", "switch"]
    restart: unless-stopped

volumes:
  prometheus-data:
  alertmanager-data:
  loki-data:
  grafana-data:

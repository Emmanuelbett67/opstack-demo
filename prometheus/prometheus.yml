global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # The central stack watches itself, so a broken monitor is not mistaken for
  # a quiet estate.
  - job_name: central
    static_configs:
      - targets:
          - prometheus:9090
          - alertmanager:9093
          - loki:3100
          - grafana:3000

  # Pull-based integrations. One file per integration, edited by hand when a
  # target is onboarded or retired.
  - job_name: database
    file_sd_configs:
      - files: [/etc/prometheus/targets/database.yml]

  - job_name: network
    file_sd_configs:
      - files: [/etc/prometheus/targets/network.yml]

  # Linux hosts are not listed here: their collectors push via remote write.
